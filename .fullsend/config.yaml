      source: harness/local-base.yaml
    - name: local-child
      source: harness/local-child.yaml
    - name: remote-base-child
      source: harness/remote-base-child.yaml
    - name: remote-child
      source: https://raw.githubusercontent.com/halfsend-04/test-repo-05-base-harness-host/main/harness/remote-child.yaml#sha256=746a09a2d1b8111cabde45f2cc042f0d65319924a8cd79d89bf5aa7bc6894e65
