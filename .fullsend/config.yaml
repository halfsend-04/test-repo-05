create_issues:
    allow_targets:
        repos:
            - halfsend-04/test-repo-05
            - fullsend-ai/fullsend
mint_url: https://bt-65f2a151-bt-mint.fullsend-ai.workers.dev
inference:
    project: it-gcp-konflux-e2e-fullsend
